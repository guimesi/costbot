# Theme: light, neutral, navy accent. Matches the HTML report palette.
# No CSS is injected anywhere in the app; change looks here.
[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1F2933"
linkColor = "#1F3A5F"
borderColor = "#D9DFE7"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
headingFontSizes = ["26px", "20px", "17px", "15px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false
chartCategoricalColors = ["#1F3A5F", "#2A9D8F", "#E9A23B", "#8E6BBE", "#C8553D", "#5C7A99", "#7F8C8D"]
dataframeBorderColor = "#D9DFE7"
dataframeHeaderBackgroundColor = "#F4F6F9"
greenColor = "#1B7F4C"
orangeColor = "#B86E00"
redColor = "#B42318"
blueColor = "#1F3A5F"
grayColor = "#5F6B7A"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
